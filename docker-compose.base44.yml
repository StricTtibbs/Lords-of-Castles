services:
  web:
    image: python:3.12-slim
    restart: on-failure
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./:/app:ro
    command: ["python", "-m", "http.server", "3000", "--bind", "0.0.0.0", "--directory", "/app"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
