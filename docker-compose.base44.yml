services:
  web:
    image: nginx:alpine
    restart: on-failure
    command: sh -c "chmod 755 /usr/share/nginx/html && exec nginx -g 'daemon off;'"
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html
      - ./nginx.base44.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
