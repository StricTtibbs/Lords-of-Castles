user root;
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    # Extensionless files in this repo are HTML — serve them as such
    default_type  text/html;
    charset       utf-8;

    server {
        listen 3000;
        server_name _;

        root /app;

        # Allow directory listing so the user can browse all files
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        # Serve index.html at root
        index index.html;

        # Try the exact file, then directory listing
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
