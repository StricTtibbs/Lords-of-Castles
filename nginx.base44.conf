user root;
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  text/html;
    charset       utf-8;

    server {
        listen       80;
        server_name  _;

        root   /app;

        # Files in this repo have no extensions and spaces in names;
        # serve everything as HTML so the browser renders them.
        types {
            text/html html htm;
        }
        default_type text/html;

        index "Main menu";

        location / {
            try_files $uri $uri/ "Main menu";
        }
    }
}
